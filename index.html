<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Support Bot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f2f2f2;
    }

    header {
      background-color: #004b91;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
    }

    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    footer {
      background-color: #004b91;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }

    .chat-input-container {
      display: flex;
      align-items: center;
      padding: 10px;
      background-color: #fff;
    }

    .chat-input {
      flex-grow: 1;
      margin-right: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .send-btn, .image-upload-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .image-upload-btn {
      background: url('data:image/png;base64,<your_base64_encoded_image>') no-repeat center;
      background-size: cover;
      width: 30px;
      height: 30px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    Welcome to Our Support Chat!
  </header>

  <!-- Embedded Copilot Bot IFrame -->
  <iframe 
    src="https://copilotstudio.microsoft.com/environments/Default-27374b0e-1a3c-4f60-be51-de13a13a5310/bots/crabb_agentqxepK6/webchat?__version__=2" 
    frameborder="0">
  </iframe>

  <div class="chat-input-container">
    <input type="text" class="chat-input" placeholder="Type your message">
    <button class="send-btn">Send</button>
    <!-- Image upload button and hidden file input -->
    <label class="image-upload-btn">
      <input type="file" class="hidden" accept="image/*">
    </label>
  </div>

  <footer>
    © 2025 Caterpillar Signs | All rights reserved
  </footer>

</body>
</html>
