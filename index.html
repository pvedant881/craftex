<!DOCTYPE html>
<html lang="en" class="h-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="A handcrafted Bootstrap 5 template for The CrafteX">
  <meta name="author" content="The CrafteX">
  <meta name="HandheldFriendly" content="true">
  <title>The CrafteX</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="96x96" href="img/favicon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/theme.min.css">
  <link rel="stylesheet" href="css/tiny-slider.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* Custom Responsive Styles */
    @media (max-width: 768px) {
      .navbar-toggler {
        position: absolute;
        top: 10px;
        left: 10px;
      }

      .navbar-brand {
        text-align: center;
        flex-grow: 1;
        margin-left: 0 !important;
      }

      .navbar-nav {
        text-align: center;
      }

      .custom-mission,
      .custom-vibe {
        font-size: 1rem !important;
      }

      .display-huge {
        font-size: 2rem !important;
      }

      .btn-xl {
        padding: 10px 20px;
        font-size: 1rem;
      }

      .navbar-icons {
        position: absolute;
        right: 10px;
        top: 10px;
      }
    }

    /* Button hover effect */
    .btn-darken:hover {
      background-color: #444 !important;
      color: #fff !important;
    }

    /* Navbar icons alignment */
    .navbar-icons a {
      margin-left: 15px;
      display: inline-block;
    }
  </style>
</head>

<body class="bg-black text-white h-100" data-bs-spy="scroll" data-bs-target="#navScroll">
  <nav id="navScroll" class="navbar navbar-dark bg-black fixed-top navbar-expand-lg">
    <div class="container">

      <!-- Navbar Toggler -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Brand -->
      <a class="navbar-brand d-flex align-items-center" href="#">
       
          <path d="M14.12 10.163l1.715.858c.22.11.22.424 0 .534L8.267 15.34a.598.598 0 0 1-.534 0L.165 11.555a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.66zM7.733.063a.598.598 0 0 1 .534 0l7.568 3.784a.3.3 0 0 1 0 .535L8.267 8.165a.598.598 0 0 1-.534 0L.165 4.382a.299.299 0 0 1 0-.535L7.733.063z" />
          <path d="M14.12 6.576l1.715.858c.22.11.22.424 0 .534l-7.568 3.784a.598.598 0 0 1-.534 0L.165 7.968a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.659z" />
        </svg>
        <span class="ms-2 fw-bolder">The CrafteX</span>
      </a>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link btn-darken" href="#">Shop with us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn-darken" href="#">Contact us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn-darken" href="#">About us</a>
          </li>
        </ul>
      </div>

      <!-- Icons -->
      <div class="navbar-icons">
        <a href="#"><img src="images/user.svg" alt="User Icon"></a>
        <a href="#"><img src="images/cart.svg" alt="Cart Icon"></a>
      </div>
    </div>
  </nav>

  <!-- Main Section -->
  <main>
    <section class="position-relative bg-black text-white py-5 d-flex align-items-center justify-content-center" style="min-height: 100vh;" data-aos="fade">
      <!-- Background Overlay -->
      <div class="position-absolute w-100 h-100 bg-black opacity-75"></div>

      <div class="container position-relative text-center">
        <div class="row align-items-center justify-content-center">
          <div class="col-12 col-xl-10">
            <span class="h5 text-muted fw-lighter custom-mission d-block mb-3">Our Mission</span>
            <h1 class="display-huge mt-3 mb-3 lh-1">We craft crazy stuff for cool people like you</h1>
          </div>
          <div class="col-12 col-xl-8">
            <p class="lead custom-vibe mb-4">Whatever your vibe, we’ve got covers that speak your style, your way!</p>
          </div>
          <div class="col-12">
            <a href="#" class="btn btn-xl btn-light">Coming Soon</a>
          </div>
        </div>
      </div>

      <!-- Responsive Styling -->
      <style>
        @media (min-width: 992px) {
          .display-huge {
            font-size: 4rem;
          }

          .custom-vibe {
            font-size: 1.5rem;
          }
        }

        @media (max-width: 768px) {
          .display-huge {
            font-size: 2rem;
          }

          .custom-mission,
          .custom-vibe {
            font-size: 1rem !important;
          }

          .btn-xl {
            padding: 10px 20px;
            font-size: 1rem;
          }
        }
      </style>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/aos.js"></script>
  <script>
    AOS.init({ duration: 800 });
  </script>
</body>

</html>
