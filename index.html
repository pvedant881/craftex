<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Support Bot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f2f2f2;
    }
 
    header {
      background-color: #004b91;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
    }

    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
 
    footer {
      background-color: #004b91;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }

    .button-container {
      position: fixed;
      right: 10px;
      bottom: 80px; /* Adjust if needed to match your layout */
      display: flex;
      flex-direction: column;
    }

    .action-button {
      margin: 5px;
      background-color: #004b91;
      border: none;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      display: flex;
      align-items: center;
      font-size: 0.9em;
    }

    .action-button i {
      margin-right: 5px;
    }

    .image-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .image-container img {
      margin: 10px;
      width: 150px;
      height: auto;
    }
</style>
</head>
<body>
 
<header>
  Welcome to Our Support Chat!
</header>
 
<!-- Zapier Chatbot Embed -->
<script async type='module' src='https://interfaces.zapier.com/assets/web-components/zapier-interfaces/zapier-interfaces.esm.js'></script>
<zapier-interfaces-chatbot-embed is-popup='false' chatbot-id='cm8qsjz4z0093hn60mlmystog' height='600px' width='400px'></zapier-interfaces-chatbot-embed>

<div class="image-container">
  <!-- Images will be loaded here -->
</div>
 
<div class="button-container">
  <button class="action-button"><i class="fas fa-envelope"></i> Please draft me a response for email</button>
  <button class="action-button"><i class="fas fa-comment-dots"></i> Please draft me a response for chat</button>
  <button class="action-button"><i class="fas fa-phone"></i> Please draft me a response for phone</button>
</div>

<footer>
  © 2025 Caterpillar Signs | All rights reserved
</footer>

<script>
  fetch('https://your-backend-url/api/images')  // Your API endpoint that returns images
  .then(response => response.json())
  .then(data => {
    const container = document.querySelector('.image-container');
    data.forEach(image => {
      const img = document.createElement('img');
      img.src = image.url;  // Ensure your API provides the URL in the response
      container.appendChild(img);
    });
  })
  .catch(error => console.error('Error loading images:', error));
</script>
 
</body>
</html>
