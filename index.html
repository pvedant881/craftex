<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Support Bot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@botpress/webchat@5/dist/webchat.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f2f2f2;
    }

    header {
      background-color: #004b91;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
    }

    .upload-container {
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    footer {
      background-color: #004b91;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    Welcome to Our Support Chat!
  </header>

  <div class="upload-container">
    <input type="file" id="image-upload" accept="image/*" />
    <button onclick="uploadImage()">Upload Image</button>
  </div>

  <!-- Embedded Copilot Bot IFrame -->
  <iframe 
    src="https://copilotstudio.microsoft.com/environments/Default-27374b0e-1a3c-4f60-be51-de13a13a5310/bots/crabb_agentqxepK6/webchat?__version__=2" 
    frameborder="0" style="flex-grow: 1;">
  </iframe>

  <footer>
    © 2025 Caterpillar Signs | All rights reserved
  </footer>

  <script>
    function uploadImage() {
      const input = document.getElementById('image-upload');
      const file = input.files[0];
      if (file) {
        // Implement the function to send the image to your server or bot for analysis
        console.log('Image uploaded:', file.name);
      }
    }
  </script>

</body>
</html>
