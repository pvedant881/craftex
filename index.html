<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Support Bot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f2f2f2;
    }
 
    header {
      background-color: #004b91;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 1.5em;
    }

    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
    }
 
    footer {
      background-color: #004b91;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }

    .button-container {
      position: fixed;
      right: 10px;
      bottom: 80px; /* Adjusted to move the buttons slightly higher */
      display: flex;
      flex-direction: column;
    }

    .action-button {
      margin: 5px;
      background-color: #004b91;
      border: none;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      display: flex;
      align-items: center;
      font-size: 0.9em;
    }

    .action-button i {
      margin-right: 5px;
    }
</style>
<script>
function sendMessage(message) {
    const chatFrame = document.querySelector('iframe');
    if (chatFrame.contentWindow) {
        // Assuming the chat iframe accepts postMessage for communication
        chatFrame.contentWindow.postMessage(message, '*');
    }
}
</script>
</head>
<body>
 
<header>
  Welcome to Our Support Chat!
</header>
 
<!-- Embedded Copilot Bot IFrame -->
<iframe 
    src="https://copilotstudio.microsoft.com/environments/Default-27374b0e-1a3c-4f60-be51-de13a13a5310/bots/crabb_oneVoice/webchat?__version__=2" 
    frameborder="0">
</iframe>
 
<div class="button-container">
  <button class="action-button" onclick="sendMessage('Please draft me a response for email')"><i class="fas fa-envelope"></i> Please draft me a response for email</button>
  <button class="action-button" onclick="sendMessage('Please draft me a response for chat')"><i class="fas fa-comment-dots"></i> Please draft me a response for chat</button>
  <button class="action-button" onclick="sendMessage('Please draft me a response for phone')"><i class="fas fa-phone"></i> Please draft me a response for phone</button>
</div>

<footer>
  © 2025 Caterpillar Signs | All rights reserved
</footer>
 
</body>
</html>
